name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      # `npm run smoke` (tools/ui-smoke.mjs) is intentionally not run here: it
      # drives headless Chrome against a live herdr server/socket, which CI
      # does not have.
